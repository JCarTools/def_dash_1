<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d12"><title>J · Instrument</title><link rel="stylesheet" href="style.css"></head>
<body><main class="dashboard" id="dashboard">

<section class="instruments" aria-label="Приборная панель"><article class="well speed-well"><div class="well-caption"><span class="turn" id="turnLeft" aria-label="Левый поворотник">◀</span></div><div class="gauge" id="speedGauge" aria-label="Спидометр"><svg viewBox="0 0 500 500" role="img" aria-label="Шкала скорости"></svg><div class="digital"><strong id="speedValue">—</strong><span>км/ч</span></div></div></article>
<section class="center-column"><div class="map-topline"><span><i></i> НАВИГАЦИЯ</span></div><div class="map-card" id="mapCard"><div class="map-placeholder"><svg viewBox="0 0 200 160"><path d="m20 35 48-19 64 23 48-18v104l-48 19-64-23-48 18Z"/><path d="M68 16v105m64-82v105"/><path class="route-line" d="m48 91 41-36 20 19 41-25"/><circle cx="48" cy="91" r="6"/></svg><strong id="mapPlaceholderTitle">Ваш маршрут — в центре</strong><span id="mapPlaceholderText">Карта появится после подключения навигации</span></div><svg class="demo-map" id="demoMap" viewBox="0 0 420 370" aria-label="Демонстрационная схема карты" hidden><rect width="420" height="370" fill="#101a22"/><g stroke="#22323e" fill="none" stroke-width="25"><path d="M-20 100 440 100M-20 280 440 280M85-20V400M325-20V400"/><path d="M-20 380 440-20"/></g><g stroke="#2e414e" fill="none" stroke-width="2"><path d="M-20 100H440M-20 280H440M85-20V400M325-20V400M-20 380 440-20"/></g><path d="M210 340V210L325 100V-10" fill="none" stroke="#58d8ee" stroke-width="12" stroke-linejoin="round"/><circle cx="210" cy="240" r="28" fill="#58d8ee" opacity=".12"/><path d="m210 219-14 31 14-7 14 7Z" fill="white"/><text x="18" y="350" fill="#87a3b4" font-size="11" font-family="sans-serif">ДЕМО</text></svg><img id="mapImage" alt="Мини-карта навигации" hidden><div class="map-vignette"></div><span class="map-live" id="mapLive" hidden>СЕЙЧАС</span></div><div class="navigation"><span class="nav-symbol" id="navSymbol">↗</span><div><strong id="navDistance">Маршрут не задан</strong><span id="navRoad">Навигационные подсказки</span></div><span class="nav-limit" id="navLimit" hidden>—</span></div><section class="music-card" id="musicCard" aria-label="Текущая музыка"><div class="music-art"><span class="music-art-placeholder" aria-hidden="true">♪</span><img id="musicArtwork" alt="Обложка альбома" hidden></div><div class="music-info"><span class="music-caption" id="musicCaption">МУЗЫКА</span><strong id="musicTitle">Ничего не играет</strong><span class="music-artist" id="musicArtist">Название трека появится здесь</span></div><span class="music-bars" id="musicBars" aria-hidden="true"><i></i><i></i><i></i><i></i></span></section><div class="center-bottom"><time id="clock">--:--</time><span id="dateLabel"></span><span id="demoLabel" hidden>ДЕМО</span><span class="beam" id="highBeam" aria-label="Дальний свет"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M17 5v14c9 0 12-3 12-7s-3-7-12-7ZM3 5h9M3 10h9M3 15h9M3 20h9"/></svg></span></div></section>
<article class="well rpm-well"><div class="well-caption"><span class="turn" id="turnRight" aria-label="Правый поворотник">▶</span></div><div class="gauge" id="rpmGauge" aria-label="Тахометр"><svg viewBox="0 0 500 500" role="img" aria-label="Шкала оборотов"></svg><div class="digital"><strong id="rpmValue">—</strong><span>об/мин</span></div></div></article></section>
<footer class="telemetry"><section class="metric fuel-metric"><span class="metric-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17M2 21h15M7 6h5v5H7ZM15 8h2l3 3v7a1.5 1.5 0 0 0 3 0v-6l-4-5"/></svg></span><div><small>ТОПЛИВО</small><strong><span id="fuelValue">—</span><em>%</em></strong></div><div class="fuel-track"><i id="fuelBar"></i></div><span class="reserve" id="reserve" hidden>РЕЗЕРВ</span></section><section class="metric"><span class="metric-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v15H3ZM6 3v3m12-3v3M6 11h5m-2.5-2.5v5M14 11h4"/></svg></span><div><small>НАПРЯЖЕНИЕ</small><strong><span id="batteryValue">—</span><em>В</em></strong></div></section><section class="metric"><span class="metric-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14.5V5a3 3 0 0 1 6 0v9.5a5 5 0 1 1-6 0ZM13 7v11m6-11h3m-3 4h2"/><circle cx="13" cy="18" r="1.5"/></svg></span><div><small>ЗА БОРТОМ</small><strong><span id="tempValue">—</span><em>°C</em></strong></div></section><section class="metric tpms-metric"><span class="metric-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3C2 8 1 15 4 21h16c3-6 2-13-2-18M2 18h3m14 0h3M12 7v7m0 3v1"/></svg></span><div><small>КОНТРОЛЬ ШИН</small><strong class="tpms-value" id="tpmsValue">Нет данных</strong></div><div class="wheel-dots" id="wheelDots"><i></i><i></i><i></i><i></i></div></section></footer>
</main>
<script src="i18n.js"></script><script src="settings.js"></script><script src="bridge.js"></script><script src="app.js"></script></body></html>
